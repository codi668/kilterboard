; Kilterboard -- LED-Kletterwand mit Touch-Griffen und Weboberflaeche
;
; Hardware: Seeed XIAO ESP32-C3, CAP1298 (I2C 0x28), 50x WS2812B
;   LED-Daten -> D10        I2C SDA -> D4 (GPIO6)
;   CAP1298 an 3V3/GND      I2C SCL -> D5 (GPIO7)
;
; Achtung: "pio pkg install" schreibt diese Datei neu und wirft die
; Kommentare weg. lib_deps also von Hand pflegen.
;
; WLAN- und OTA-Passwort liegen in secrets.ini (nicht im Repo),
; Vorlage: secrets.example.ini

[platformio]
extra_configs = secrets.ini

[common]
platform = espressif32 @ 6.8.1
board = seeed_xiao_esp32c3
framework = arduino
; Serielle Ausgabe ueber den nativen USB des C3 (kein extra Adapter)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; 1.9 MB pro App-Slot: genug Platz fuer zwei OTA-Images, kein Dateisystem
; noetig (Weboberflaeche liegt im Flash, Einstellungen im NVS)
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_c3_exception_decoder
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

; Erstes Flashen per USB-Kabel
[env:kilterboard]
extends = common
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Der native USB-Serial/JTAG des C3 vertraegt den Wechsel auf 460800 nicht
; ("No serial data received"), deshalb fest bei 115200 bleiben.
upload_speed = 115200

; Danach drahtlos: pio run -e kilterboard_ota -t upload
; (Adresse/Passwort kommen aus secrets.ini)
[env:kilterboard_ota]
extends = common
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags =
  --port=3232
  --auth=${secrets.ota_password}
